[project]
name = "rl-sweagent"
version = "0.1.0"
description = "A package for running public benchmarks using the Runloop API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.53.0",
    "openai>=1.82.1",
    "ruff>=0.11.11",
    "tqdm>=4.66.0",
    "runloop-api-client>=0.40.0",
    "datasets>=3.6.0",
    "pyright>=1.1.402",
    "pre-commit>=4.2.0",
    "rl-cli>=0.2.13",
    "aiofiles>=24.1.0",
]

[project.scripts]
rl-sweagent = "rl_sweagent.run_public_benchmark:main"
rl-list-benchmarks = "rl_sweagent.list_benchmarks:main"
rl-create-benchmark = "rl_sweagent.create_custom_benchmark:main"
rl-shutdown-devboxes = "rl_sweagent.shutdown_running_devboxes:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "swe-bench-fork",
]

# Same as Black.
line-length = 88

# Assume Python 3.12
target-version = "py312"

[tool.ruff.lint]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
select = ["E", "F", "I"]
ignore = ["E501"]  # Ignore line too long

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
# Ignore import errors in all `__init__.py` files
"__init__.py" = ["F401"]
